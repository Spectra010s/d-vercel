name: Deploy to Vercel
description: Seamlessly deploy frontend and full-stack applications to Vercel from GitHub Actions.
author: "Spectra010s"

inputs:
  vercel-token:
    description: "Vercel token"
    required: true
  vercel-org-id:
    description: "Vercel org/team ID"
    required: true
  vercel-project-id:
    description: "Vercel project ID"
    required: true
  github-token:
    description: "GitHub token used to create or update PR comments"
    required: false
    default: ""
  vercel-version:
    description: "Vercel CLI version to run. Defaults to latest."
    required: false
    default: "latest"
  production:
    description: "Deploy as production (true/false). false = preview"
    required: false
    default: "false"
  prebuilt:
    description: "Deploy prebuilt assets (true/false). If true, skips 'pull' and deploys using '--prebuilt'."
    required: false
    default: "false"
  working-directory:
    description: "Directory to run Vercel commands from"
    required: false
    default: "."
  sticky-comment:
    description: "Whether to update a single sticky comment on the PR, or post a new one on each change"
    required: false
    default: "true"
  comment-title:
    description: "PR comment title"
    required: false
    default: "Vercel Deployment"
  fail-on-error:
    description: "If true, fail the action when deploy fails"
    required: false
    default: "true"
  ignore-build-step:
    description: "Command or script to execute to determine if the build/deployment should be ignored. Exiting with 0 ignores/skips the build."
    required: false
    default: ""


outputs:
  deployment-url:
    description: "Detected Vercel deployment URL"
  status:
    description: "Deployment status: success or failure"

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "upload-cloud"
  color: "black"
